[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
  "**/__pycache__/**",
  "**/data/**",
  "**/models/**",
  "**/scratch/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "BLE"]
ignore = [
  "E501", # Cho phép mô tả tiếng Việt hoặc URL dài; formatter vẫn chuẩn hóa mã.
  "RUF002", # Cho phép ký hiệu toán học Unicode trong docstring.
  "S101", # Pytest sử dụng assert theo thiết kế.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
