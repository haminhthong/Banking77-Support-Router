# Cấu hình classifier và pipeline hiệu chuẩn.

seed: 42

features:
  word:
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.98
    sublinear_tf: true
    max_features: 50000
  char:
    analyzer: "char_wb"
    ngram_range: [3, 5]
    min_df: 3
    sublinear_tf: true
    max_features: 25000

classifier:
  type: "logistic_regression"
  params:
    C: 4.0
    max_iter: 1200
    class_weight: "balanced"
    solver: "lbfgs"
    n_jobs: null

calibration:
  method: "temperature_or_raw"
  selection_metric: "nll"
  selection_split: "policy_validation"
